<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C872"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A68A2E"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1A2F4A"/>
    </linearGradient>
  </defs>
  <!-- Icon: water drop with wrench -->
  <g transform="translate(36,36)">
    <circle cx="0" cy="0" r="30" fill="url(#navy)" stroke="url(#gold)" stroke-width="2"/>
    <path d="M0,-20 C0,-20 14,-2 14,8 C14,15.7 7.7,22 0,22 C-7.7,22 -14,15.7 -14,8 C-14,-2 0,-20 0,-20Z" 
          fill="url(#gold)" opacity="0.9"/>
    <g transform="translate(0,4)" fill="#0D1B2A" opacity="0.8">
      <rect x="-2" y="-14" width="4" height="20" rx="2"/>
      <rect x="-8" y="-14" width="16" height="4" rx="2"/>
      <rect x="-8" y="-14" width="4" height="10" rx="2"/>
      <rect x="4" y="-14" width="4" height="10" rx="2"/>
    </g>
  </g>
  <!-- Text: FlowJob -->
  <text x="80" y="42" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="800" 
        fill="url(#gold)" letter-spacing="-1">Flow</text>
  <text x="168" y="42" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" 
        fill="rgba(255,255,255,0.7)" letter-spacing="-1">Job</text>
  <!-- Subtitle -->
  <text x="80" y="62" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" 
        fill="rgba(255,255,255,0.35)" letter-spacing="3" text-transform="uppercase">PLUMBING MANAGER</text>
</svg>
