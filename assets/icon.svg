<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1A2F4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C872"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A68A2E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A84C" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Water drop -->
  <path d="M256 80 C256 80 340 190 340 270 C340 316 302 354 256 354 C210 354 172 316 172 270 C172 190 256 80 256 80Z" 
        fill="url(#gold)" filter="url(#glow)" opacity="0.95"/>
  <!-- Wrench inside drop -->
  <g transform="translate(256,250)" fill="#0D1B2A" opacity="0.85">
    <rect x="-6" y="-50" width="12" height="70" rx="4"/>
    <rect x="-22" y="-50" width="44" height="12" rx="4"/>
    <rect x="-22" y="-50" width="12" height="28" rx="4"/>
    <rect x="10" y="-50" width="12" height="28" rx="4"/>
    <circle cx="0" cy="30" r="10" fill="none" stroke="#0D1B2A" stroke-width="5"/>
  </g>
</svg>
