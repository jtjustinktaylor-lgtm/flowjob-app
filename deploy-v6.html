*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e18;color:#e4e6eb;min-height:100vh;display:flex;align-items:center;justify-content:center}
.c{max-width:560px;width:100%;padding:24px}

.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#C9A84C,#A68A2E);color:#0D1B2A}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:wait}
.log{background:#0a0e18;border:1px solid #2D3040;border-radius:8px;padding:10px;max-height:200px;overflow-y:auto;font:11px/1.6 monospace;margin-top:10px}
.ok{color:#059669}.err{color:#DC2626}.inf{color:#60A5FA}
.bar{height:3px;background:#2D3040;border-radius:2px;margin:8px 0;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#A68A2E,#E0C872);transition:width .3s}

let F=null;
async function getFiles(){
if(F)return F;
const bin=atob(B64);
const arr=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
const ds=new DecompressionStream("gzip");
const w=ds.writable.getWriter();
w.write(arr);w.close();
const out=await new Response(ds.readable).text();
F=JSON.parse(out);
return F;
}

const API="https://api.github.com/repos/jtjustinktaylor-lgtm/flowjob-app/contents/";

async function push(){
const btn=document.getElementById("btn"),t=document.getElementById("t").value,m=document.getElementById("m").value;
const log=document.getElementById("log"),bar=document.getElementById("bar");
if(!t)return alert("Need token");
btn.disabled=true;log.innerHTML="";

function L(s,c){log.innerHTML+="<div class='"+c+"'>"+s+"</div>";log.scrollTop=9e9}

L("📦 Decompressing files...","inf");
const files=await getFiles();
const K=Object.keys(files);let ok=0,fail=0;
L("✅ "+K.length+" files loaded","ok");

L("📡 Getting current tree...","inf");
const ref=await(await fetch(API+"git/refs/heads/main",{headers:{Authorization:"token "+t}})).json();
if(!ref.object){L("❌ Bad token","err");btn.disabled=false;return}
const cs=ref.object.sha;
const cd=await(await fetch(API+"git/commits/"+cs,{headers:{Authorization:"token "+t}})).json();
const ts=cd.tree.sha;

const entries=[];
for(let i=0;i<K.length;i++){
const p=K[i];bar.style.width=((i+1)/K.length*80)+"%";
try{
const b=btoa(unescape(encodeURIComponent(files[p])));
const r=await fetch(API+"git/blobs",{method:"POST",headers:{Authorization:"token "+t,"Content-Type":"application/json"},body:JSON.stringify({encoding:"base64",content:b})});
if(!r.ok){L("⚠️ "+p+": "+r.status,"err");fail++;continue}
const d=await r.json();
entries.push({path:p,mode:"100644",type:"blob",sha:d.sha});
L("✅ "+p,"ok");ok++;
}catch(e){L("❌ "+p,"err");fail++}
}

bar.style.width="85%";
L("🌳 Creating tree...","inf");
const tr=await(await fetch(API+"git/trees",{method:"POST",headers:{Authorization:"token "+t,"Content-Type":"application/json"},body:JSON.stringify({base_tree:ts,tree:entries})})).json();
if(!tr.sha){L("❌ Tree failed","err");btn.disabled=false;return}

bar.style.width="90%";
L("📝 Commit...","inf");
const cm=await(await fetch(API+"git/commits",{method:"POST",headers:{Authorization:"token "+t,"Content-Type":"application/json"},body:JSON.stringify({message:m,tree:tr.sha,parents:[cs]})})).json();
if(!cm.sha){L("❌ Commit failed","err");btn.disabled=false;return}

bar.style.width="95%";
L("🔗 Updating ref...","inf");
await fetch(API+"git/refs/heads/main",{method:"PATCH",headers:{Authorization:"token "+t,"Content-Type":"application/json"},body:JSON.stringify({sha:cm.sha})});

bar.style.width="100%";
L("✅ Done! "+ok+" pushed, "+fail+" failed","ok");
L("🌐 https://jtjustinktaylor-lgtm.github.io/flowjob-app/","ok");
btn.disabled=false;
}
</script>
