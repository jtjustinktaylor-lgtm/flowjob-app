<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e18;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#0f1624 0%,#1a1f35 100%);border-bottom:2px solid #C9A84C;padding:24px 32px;display:flex;align-items:center;gap:16px}
.header h1{font-size:24px;color:#C9A84C;font-weight:700}
.header .version{background:#C9A84C;color:#0a0e18;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.header .file-count{color:#888;font-size:13px;margin-left:auto}
.tabs{display:flex;background:#0d1220;border-bottom:1px solid #1e2640}
.tab{padding:14px 28px;cursor:pointer;font-size:15px;color:#888;border-bottom:3px solid transparent;transition:all .2s}
.tab:hover{color:#ccc}
.tab.active{color:#C9A84C;border-bottom-color:#C9A84C;background:rgba(201,168,76,.05)}
.panel{display:none;padding:24px 32px;flex:1}
.panel.active{display:block}
.card{background:#111827;border:1px solid #1e2640;border-radius:12px;padding:24px;margin-bottom:20px}
label{display:block;font-size:13px;color:#888;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input[type=text],textarea{width:100%;background:#0a0e18;border:1px solid #2a3350;color:#e0e0e0;padding:10px 14px;border-radius:8px;font-family:'Fira Code',monospace;font-size:13px;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:#C9A84C}
textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-gold{background:linear-gradient(135deg,#C9A84C,#e0c068);color:#0a0e18}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(201,168,76,.3)}
.btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;border:1px solid #C9A84C;color:#C9A84C}
.btn-outline:hover{background:rgba(201,168,76,.1)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.progress-wrap{margin-top:20px;display:none}
.progress-bar-bg{background:#1e2640;border-radius:6px;height:8px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#C9A84C,#e0c068);width:0%;transition:width .3s;border-radius:6px}
.log{background:#080c14;border:1px solid #1e2640;border-radius:8px;padding:12px;margin-top:12px;max-height:400px;overflow-y:auto;font-family:'Fira Code',monospace;font-size:12px;line-height:1.8}
.log-entry{color:#6a7a9a}
.log-entry.success{color:#4ade80}
.log-entry.error{color:#f87171}
.log-entry.info{color:#C9A84C}
.status-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.status-badge.ok{background:rgba(74,222,128,.15);color:#4ade80}
.status-badge.err{background:rgba(248,113,113,.15);color:#f87171}
footer{text-align:center;padding:16px;color:#555;font-size:12px;border-top:1px solid #1e2640;margin-top:auto}
</style>
</head>

</div>

      <div><label>Branch</label><input type="text" id="gh-branch" value="main"></div>

    <div style="margin-top:16px"><label>Commit Message</label><textarea id="gh-msg">FlowJob v6.1: Fixed layout, bottom nav, sidebar overlay, utility classes, routing</textarea></div>
    <div class="btn-row">
      <button class="btn btn-gold" onclick="pushToGitHub()">🐙 Push All Files</button>
    </div>
  </div>
  <div class="progress-wrap" id="progress-github">
    <div class="progress-bar-bg"><div class="progress-bar" id="bar-github"></div></div>
    <div class="log" id="log-github"></div>
  </div>
</div>

<footer>FlowJob Deploy Tool — Self-contained, zero dependencies — Neo × PaxLabs</footer>

const FILE_KEYS = Object.keys(FILES);
document.querySelector('.file-count').textContent = FILE_KEYS.length + ' files embedded';

function decodeFile(key) {
  const entry = FILES[key];
  if (entry && entry.binary) {
    const raw = atob(entry.data);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  return atob(entry);
}

function decodeFileUint8(key) {
  const entry = FILES[key];
  if (entry && entry.binary) {
    const raw = atob(entry.data);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  const raw = atob(entry);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

function log(el, msg, cls) {
  const d = document.createElement('div');
  d.className = 'log-entry ' + (cls||'');
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function setProgress(barEl, pct) {
  barEl.style.width = pct + '%';
}

async function extractToFolder() {
  if (!window.showDirectoryPicker) {
    alert('File System Access API not supported. Use Chrome or Edge 86+.');
    return;
  }
  const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  const progWrap = document.getElementById('progress-extract');
  const bar = document.getElementById('bar-extract');
  const logEl = document.getElementById('log-extract');
  progWrap.style.display = 'block';
  logEl.innerHTML = '';
  const total = FILE_KEYS.length;
  let done = 0;
  for (const key of FILE_KEYS) {
    try {
      const parts = key.split('/');
      let current = dirHandle;
      for (let i = 0; i < parts.length - 1; i++) {
        current = await current.getDirectoryHandle(parts[i], { create: true });
      }
      const fh = await current.getFileHandle(parts[parts.length-1], { create: true });
      const w = await fh.createWritable();
      const data = decodeFileUint8(key);
      await w.write(data);
      await w.close();
      done++;
      log(logEl, '✅ ' + key, 'success');
    } catch(e) {
      done++;
      log(logEl, '❌ ' + key + ': ' + e.message, 'error');
    }
    setProgress(bar, Math.round(done/total*100));
  }
  log(logEl, '\n✅ Extracted ' + done + ' files.', 'info');
}

async function pushToGitHub() {
  const token = document.getElementById('gh-token').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const branch = document.getElementById('gh-branch').value.trim();
  const msg = document.getElementById('gh-msg').value.trim();
  if (!token || !repo) { alert('Token and repo required'); return; }

  const progWrap = document.getElementById('progress-github');
  const bar = document.getElementById('bar-github');
  const logEl = document.getElementById('log-github');
  progWrap.style.display = 'block';
  logEl.innerHTML = '';

  const headers = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' };
  const apiBase = 'https://api.github.com/repos/' + repo;

  // Get current tree
  log(logEl, 'Fetching current HEAD...', 'info');
  let refData;
  try {
    const refRes = await fetch(apiBase + '/git/refs/heads/' + branch, { headers });
    if (!refRes.ok) throw new Error('Ref not found: ' + refRes.status);
    refData = await refRes.json();
  } catch(e) {
    log(logEl, '❌ ' + e.message, 'error');
    return;
  }
  const latestSha = refData.object.sha;
  log(logEl, 'HEAD: ' + latestSha, 'info');

  // Get commit to find tree
  const commitRes = await fetch(apiBase + '/git/commits/' + latestSha, { headers });
  const commitData = await commitRes.json();
  const baseTreeSha = commitData.tree.sha;

  // Create blobs
  log(logEl, 'Creating blobs for ' + FILE_KEYS.length + ' files...', 'info');
  const treeEntries = [];
  let done = 0;
  for (const key of FILE_KEYS) {
    try {
      const entry = FILES[key];
      let body;
      if (entry && entry.binary) {
        body = JSON.stringify({ content: entry.data, encoding: 'base64' });
      } else {
        body = JSON.stringify({ content: entry, encoding: 'base64' });
      }
      const blobRes = await fetch(apiBase + '/git/blobs', {
        method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body
      });
      if (!blobRes.ok) throw new Error('Blob failed: ' + blobRes.status);
      const blobData = await blobRes.json();
      treeEntries.push({ path: key, mode: key.endsWith('.png') ? '100644' : '100644', type: 'blob', sha: blobData.sha });
      done++;
      log(logEl, '✅ ' + key, 'success');
    } catch(e) {
      done++;
      log(logEl, '❌ ' + key + ': ' + e.message, 'error');
    }
    setProgress(bar, Math.round(done/FILE_KEYS.length*70));
  }

  // Create tree
  log(logEl, 'Creating tree...', 'info');
  const treeRes = await fetch(apiBase + '/git/trees', {
    method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ base_tree: baseTreeSha, tree: treeEntries })
  });
  const treeData = await treeRes.json();
  setProgress(bar, 78);

  // Create commit
  log(logEl, 'Creating commit...', 'info');
  const newCommitRes = await fetch(apiBase + '/git/commits', {
    method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg, tree: treeData.sha, parents: [latestSha] })
  });
  const newCommit = await newCommitRes.json();
  setProgress(bar, 88);

  // Update ref
  log(logEl, 'Updating branch ref...', 'info');
  const updateRes = await fetch(apiBase + '/git/refs/heads/' + branch, {
    method: 'PATCH', headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ sha: newCommit.sha, force: true })
  });
  setProgress(bar, 100);

  if (updateRes.ok) {
    log(logEl, '\n🎉 Push complete! Commit: ' + newCommit.sha.substring(0,7), 'info');
    log(logEl, '🔗 https://github.com/' + repo + '/commit/' + newCommit.sha, 'info');
  } else {
    log(logEl, '❌ Failed to update ref: ' + updateRes.status, 'error');
  }
}
