<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowJob Logo Preview</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0D1B2A 0%, #1A2F4A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .preview {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .preview img {
      width: 100%;
      height: auto;
      display: block;
    }
    .info {
      padding: 20px;
    }
    .info h3 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #0D1B2A;
    }
    .info p {
      margin: 0;
      color: #6B7280;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="preview">
    <img src="assets/flowjob-logo.jpg" alt="FlowJob Logo">
    <div class="info">
      <h3>Your Logo</h3>
      <p>1024x1024 JPG — ready for social media, landing page hero, or print</p>
    </div>
  </div>
</body>
</html>
