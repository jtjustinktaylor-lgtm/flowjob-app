<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowJob Icon Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0D1B2A;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #E0C872, #C9A84C, #A68A2E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: rgba(255,255,255,0.5); margin-bottom: 32px; font-size: 14px; }
    .preview-row {
      display: flex;
      gap: 32px;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-box {
      text-align: center;
    }
    .preview-box canvas {
      border-radius: 22%;
      box-shadow: 0 8px 30px rgba(201,168,76,0.2);
      display: block;
      margin-bottom: 8px;
    }
    .preview-label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 6px;
    }
    .btn-gold {
      background: linear-gradient(135deg, #E0C872, #C9A84C);
      color: #0D1B2A;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(201,168,76,0.3); }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
    }
    .btn-outline:hover { border-color: #C9A84C; color: #C9A84C; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .status {
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      max-width: 500px;
      text-align: center;
    }
    .maskable-preview {
      background: #7C3AED;
      padding: 12%;
      border-radius: 22%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>🔧 FlowJob Icon Generator</h1>
  <p class="subtitle">Generate PWA icons from the SVG logo</p>

  <div class="preview-row" id="previews"></div>

  <div class="btn-row">
    <button class="btn btn-gold" onclick="downloadAll()">⬇ Download All Icons</button>
    <button class="btn btn-outline" onclick="download192()">icon-192.png</button>
    <button class="btn btn-outline" onclick="download512()">icon-512.png</button>
    <button class="btn btn-outline" onclick="downloadMaskable()">icon-512-maskable.png</button>
  </div>

  <div class="status" id="status">Ready — click a button to generate and download</div>

  <script>
    const SVG_SOURCE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0D1B2A"/>
          <stop offset="100%" stop-color="#1A2F4A"/>
        </linearGradient>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E0C872"/>
          <stop offset="50%" stop-color="#C9A84C"/>
          <stop offset="100%" stop-color="#A68A2E"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A84C" flood-opacity="0.4"/>
        </filter>
      </defs>
      <rect width="512" height="512" rx="108" fill="url(#bg)"/>
      <path d="M256 80 C256 80 340 190 340 270 C340 316 302 354 256 354 C210 354 172 316 172 270 C172 190 256 80 256 80Z" fill="url(#gold)" filter="url(#glow)" opacity="0.95"/>
      <g transform="translate(256,250)" fill="#0D1B2A" opacity="0.85">
        <rect x="-6" y="-50" width="12" height="70" rx="4"/>
        <rect x="-22" y="-50" width="44" height="12" rx="4"/>
        <rect x="-22" y="-50" width="12" height="28" rx="4"/>
        <rect x="10" y="-50" width="12" height="28" rx="4"/>
        <circle cx="0" cy="30" r="10" fill="none" stroke="#0D1B2A" stroke-width="5"/>
      </g>
    </svg>`;

    // Maskable version with extra safe-zone padding
    const MASKABLE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0D1B2A"/>
          <stop offset="100%" stop-color="#1A2F4A"/>
        </linearGradient>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E0C872"/>
          <stop offset="50%" stop-color="#C9A84C"/>
          <stop offset="100%" stop-color="#A68A2E"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" fill="url(#bg)"/>
      <g transform="translate(256,256) scale(0.65)" opacity="0.95">
        <path d="M0 -176 C0 -176 84 -66 84 14 C84 60 46 98 0 98 C-46 98 -84 60 -84 14 C-84 -66 0 -176 0 -176Z" fill="url(#gold)"/>
        <g transform="translate(0,-6)" fill="#0D1B2A" opacity="0.85">
          <rect x="-6" y="-50" width="12" height="70" rx="4"/>
          <rect x="-22" y="-50" width="44" height="12" rx="4"/>
          <rect x="-22" y="-50" width="12" height="28" rx="4"/>
          <rect x="10" y="-50" width="12" height="28" rx="4"/>
          <circle cx="0" cy="30" r="10" fill="none" stroke="#0D1B2A" stroke-width="5"/>
        </g>
      </g>
    </svg>`;

    function svgToCanvas(svgString, size) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const blob = new Blob([svgString], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(canvas);
        };
        img.src = url;
      });
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    }

    let canvases = {};

    async function generateAll() {
      const status = document.getElementById('status');
      status.textContent = 'Generating icons...';

      canvases.icon192 = await svgToCanvas(SVG_SOURCE, 192);
      canvases.icon512 = await svgToCanvas(SVG_SOURCE, 512);
      canvases.maskable = await svgToCanvas(MASKABLE_SVG, 512);

      // Show previews
      const previews = document.getElementById('previews');
      previews.innerHTML = '';
      
      [
        { canvas: canvases.icon192, label: '192×192' },
        { canvas: canvases.icon512, label: '512×512' },
        { canvas: canvases.maskable, label: '512×512 Maskable' },
      ].forEach(({ canvas, label }) => {
        const box = document.createElement('div');
        box.className = 'preview-box';
        const preview = document.createElement('canvas');
        preview.width = 120;
        preview.height = 120;
        preview.getContext('2d').drawImage(canvas, 0, 0, 120, 120);
        box.appendChild(preview);
        const lbl = document.createElement('div');
        lbl.className = 'preview-label';
        lbl.textContent = label;
        box.appendChild(lbl);
        previews.appendChild(box);
      });

      status.textContent = '✅ Icons generated! Click download buttons to save.';
    }

    async function download192() {
      if (!canvases.icon192) await generateAll();
      downloadCanvas(canvases.icon192, 'icon-192.png');
      document.getElementById('status').textContent = '✅ Downloaded icon-192.png';
    }

    async function download512() {
      if (!canvases.icon512) await generateAll();
      downloadCanvas(canvases.icon512, 'icon-512.png');
      document.getElementById('status').textContent = '✅ Downloaded icon-512.png';
    }

    async function downloadMaskable() {
      if (!canvases.maskable) await generateAll();
      downloadCanvas(canvases.maskable, 'icon-512-maskable.png');
      document.getElementById('status').textContent = '✅ Downloaded icon-512-maskable.png';
    }

    async function downloadAll() {
      await generateAll();
      downloadCanvas(canvases.icon192, 'icon-192.png');
      setTimeout(() => downloadCanvas(canvases.icon512, 'icon-512.png'), 300);
      setTimeout(() => downloadCanvas(canvases.maskable, 'icon-512-maskable.png'), 600);
      document.getElementById('status').textContent = '✅ Downloaded all 3 icons! Drop them in assets/ folder.';
    }

    // Auto-generate on load
    generateAll();
  </script>
</body>
</html>
