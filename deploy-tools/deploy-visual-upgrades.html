<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowJob — Deploy Visual Upgrades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0D1B2A;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 520px;
      width: 100%;
      padding: 32px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #E0C872, #C9A84C, #A68A2E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      margin-top: 4px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #C9A84C;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: rgba(255,255,255,0.6);
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      font-size: 14px;
      font-family: monospace;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #C9A84C; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #C9A84C, #A68A2E);
      color: #0D1B2A;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(201,168,76,0.3); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
    }
    .btn-outline:hover { border-color: #C9A84C; color: #C9A84C; }
    #log {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      font-family: monospace;
      max-height: 240px;
      overflow-y: auto;
      line-height: 1.6;
      margin-top: 12px;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #60a5fa; }
    .file-list {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .file-list .count { color: #C9A84C; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🔧 FlowJob Deploy</h1>
      <p>Push visual upgrades to GitHub</p>
    </div>

    <div class="card">
      <h3>🔑 GitHub Token</h3>
      <label>Personal Access Token (repo scope)</label>
      <input type="password" id="token" placeholder="ghp_..." />
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn-outline" onclick="saveToken()" style="flex:1;font-size:12px;padding:8px">💾 Save Token</button>
        <button class="btn-outline" onclick="loadToken()" style="flex:1;font-size:12px;padding:8px">📂 Load Saved</button>
      </div>
      <label>Repository</label>
      <input type="text" id="repo" value="jtjustinktaylor-lgtm/flowjob-app" />
      <label>Branch</label>
      <input type="text" id="branch" value="main" />
    </div>

    <div class="card">
      <h3>📦 Files to Push</h3>
      <div class="file-list" id="file-list">Loading...</div>
      <button class="btn-primary" id="deploy-btn" onclick="deploy()">🚀 Push to GitHub</button>
    </div>

    <div class="card">
      <h3>📋 Log</h3>
      <div id="log"></div>
    </div>
  </div>

  <script>
    // The files changed in this visual upgrades batch
    const FILES_TO_PUSH = [
      'icons.js',
      'style.css',
      'app.js',
      'manifest.json',
      'index.html',
      'sw.js',
      'pages/quotes.js',
      'pages/invoices.js',
      'pages/inventory.js',
    ];

    // Stored file contents (loaded from workspace)
    const FILE_CONTENTS = {};

    const API = 'https://api.github.com';

    function log(msg, cls = '') {
      const el = document.getElementById('log');
      el.innerHTML += `<div class="${cls}">${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function saveToken() {
      localStorage.setItem('flowjob_github_token', document.getElementById('token').value);
      log('✅ Token saved to localStorage', 'ok');
    }

    function loadToken() {
      const t = localStorage.getItem('flowjob_github_token');
      if (t) { document.getElementById('token').value = t; log('📂 Token loaded', 'info'); }
      else log('❌ No saved token found', 'err');
    }

    async function getFileSHA(repo, branch, path, token) {
      const res = await fetch(`${API}/repos/${repo}/contents/${path}?ref=${branch}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`GET SHA failed for ${path}: ${res.status}`);
      const data = await res.json();
      return data.sha;
    }

    async function pushFile(repo, branch, path, content, token, sha = null) {
      const body = {
        message: `update ${path} — visual upgrades (empty states, icons, manifest, splash)`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch
      };
      if (sha) body.sha = sha;

      const res = await fetch(`${API}/repos/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(`Push ${path} failed: ${res.status} — ${err.message || JSON.stringify(err)}`);
      }
      return await res.json();
    }

    async function deploy() {
      const token = document.getElementById('token').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const branch = document.getElementById('branch').value.trim();

      if (!token) return log('❌ Enter a GitHub token', 'err');

      const btn = document.getElementById('deploy-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Pushing...';
      log('', '');
      log('═══════════════════════════════════════', 'info');
      log('🚀 Starting deploy — visual upgrades batch', 'info');
      log(`📦 Repo: ${repo} @ ${branch}`, 'info');
      log(`📄 Files: ${FILES_TO_PUSH.length}`, 'info');
      log('═══════════════════════════════════════', 'info');

      let success = 0;
      let failed = 0;

      for (const path of FILES_TO_PUSH) {
        const content = FILE_CONTENTS[path];
        if (!content) {
          log(`⚠️ ${path} — no content loaded, skipping`, 'err');
          failed++;
          continue;
        }

        try {
          log(`⏳ ${path} — getting SHA...`, 'info');
          const sha = await getFileSHA(repo, branch, path, token);
          log(`⏳ ${path} — pushing ${content.length} bytes...`, 'info');
          await pushFile(repo, branch, path, content, token, sha);
          log(`✅ ${path} — pushed`, 'ok');
          success++;
        } catch (e) {
          log(`❌ ${path} — ${e.message}`, 'err');
          failed++;
        }

        // Rate limit: small delay between requests
        await new Promise(r => setTimeout(r, 300));
      }

      log('', '');
      log('═══════════════════════════════════════', 'info');
      log(`🏁 Done! ✅ ${success} pushed, ❌ ${failed} failed`, success > 0 ? 'ok' : 'err');
      if (success > 0) {
        log(`🔗 https://github.com/${repo}/tree/${branch}`, 'ok');
        log(`🌐 https://jtjustinktaylor-lgtm.github.io/flowjob-app/`, 'ok');
      }
      log('═══════════════════════════════════════', 'info');

      btn.disabled = false;
      btn.textContent = '🚀 Push to GitHub';
    }

    // Auto-load token
    window.addEventListener('DOMContentLoaded', () => {
      loadToken();
      document.getElementById('file-list').innerHTML =
        `<span class="count">${FILES_TO_PUSH.length} files</span> — ${FILES_TO_PUSH.join(', ')}`;
    });
  </script>
</body>
</html>
