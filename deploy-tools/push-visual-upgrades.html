<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowJob — Push Visual Upgrades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0D1B2A;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 520px; width: 100%; padding: 32px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #E0C872, #C9A84C, #A68A2E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo p { color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 4px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
    .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #C9A84C; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: rgba(255,255,255,0.6); }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #e2e8f0; font-size: 14px; font-family: monospace; margin-bottom: 12px; }
    input:focus { outline: none; border-color: #C9A84C; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #C9A84C, #A68A2E); color: #0D1B2A; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(201,168,76,0.3); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); }
    .btn-outline:hover { border-color: #C9A84C; color: #C9A84C; }
    #log { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; max-height: 300px; overflow-y: auto; line-height: 1.6; margin-top: 12px; }
    .ok { color: #4ade80; } .err { color: #f87171; } .info { color: #60a5fa; }
    .file-list { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.8; margin-bottom: 12px; }
    .file-list .count { color: #C9A84C; font-weight: 600; }
    .progress { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin: 12px 0; overflow: hidden; display: none; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #A68A2E, #C9A84C, #E0C872); border-radius: 2px; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🔧 FlowJob Push</h1>
      <p>Visual upgrades → GitHub Pages</p>
    </div>

    <div class="card">
      <h3>🔑 GitHub</h3>
      <label>Personal Access Token</label>
      <input type="password" id="token" placeholder="ghp_..." />
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn-outline" onclick="saveToken()" style="flex:1;font-size:12px;padding:8px">💾 Save</button>
        <button class="btn-outline" onclick="loadToken()" style="flex:1;font-size:12px;padding:8px">📂 Load</button>
      </div>
      <label>Repository</label>
      <input type="text" id="repo" value="jtjustinktaylor-lgtm/flowjob-app" />
    </div>

    <div class="card">
      <h3>📂 Select Workspace Folder</h3>
      <p style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:12px">Point to your FlowJob folder — we'll read the changed files automatically</p>
      <button class="btn-outline" onclick="pickFolder()" id="pick-btn">📁 Choose FlowJob Folder</button>
      <div id="folder-status" style="font-size:12px;margin-top:8px;color:rgba(255,255,255,0.4)"></div>
    </div>

    <div class="card">
      <h3>🚀 Deploy</h3>
      <div class="file-list" id="file-list">No folder selected</div>
      <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <button class="btn-primary" id="deploy-btn" onclick="deploy()" disabled>🚀 Push Visual Upgrades</button>
    </div>

    <div class="card">
      <h3>📋 Log</h3>
      <div id="log"></div>
    </div>
  </div>

  <script>
    const FILES_TO_PUSH = [
      'icons.js',
      'style.css',
      'app.js',
      'manifest.json',
      'index.html',
      'sw.js',
      'pages/quotes.js',
      'pages/invoices.js',
      'pages/inventory.js',
    ];

    const API = 'https://api.github.com';
    let dirHandle = null;
    let fileContents = {};

    function log(msg, cls = '') {
      const el = document.getElementById('log');
      el.innerHTML += `<div class="${cls}">${new Date().toLocaleTimeString()} ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function saveToken() {
      localStorage.setItem('flowjob_github_token', document.getElementById('token').value);
      log('✅ Token saved', 'ok');
    }

    function loadToken() {
      const t = localStorage.getItem('flowjob_github_token');
      if (t) { document.getElementById('token').value = t; log('📂 Token loaded', 'info'); }
      else log('No saved token', 'err');
    }

    async function pickFolder() {
      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        document.getElementById('folder-status').textContent = `📂 ${dirHandle.name}`;
        document.getElementById('pick-btn').textContent = `📂 ${dirHandle.name}`;

        fileContents = {};
        let loaded = 0;

        for (const path of FILES_TO_PUSH) {
          try {
            const parts = path.split('/');
            let handle = dirHandle;
            for (let i = 0; i < parts.length - 1; i++) {
              handle = await handle.getDirectoryHandle(parts[i]);
            }
            const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
            const file = await fileHandle.getFile();
            fileContents[path] = await file.text();
            loaded++;
          } catch (e) {
            log(`⚠️ ${path} — not found`, 'err');
          }
        }

        document.getElementById('file-list').innerHTML =
          `<span class="count">${loaded}/${FILES_TO_PUSH.length} files found</span>`;
        document.getElementById('deploy-btn').disabled = loaded === 0;
        log(`📂 Loaded ${loaded} files from ${dirHandle.name}`, 'ok');
      } catch (e) {
        if (e.name !== 'AbortError') log(`❌ ${e.message}`, 'err');
      }
    }

    async function getFileSHA(repo, path, token) {
      const branch = 'main';
      const res = await fetch(`${API}/repos/${repo}/contents/${path}?ref=${branch}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`SHA ${path}: ${res.status}`);
      return (await res.json()).sha;
    }

    async function pushFile(repo, path, content, token, sha) {
      const body = {
        message: `update ${path} — visual upgrades (empty states, icons, manifest, splash)\n\n- Custom SVG empty state illustrations (9 variants)\n- PWA manifest overhaul (shortcuts, maskable, categories)\n- Splash screen drop animation\n- Apple/Microsoft meta tags\n- Service worker v3`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: 'main'
      };
      if (sha) body.sha = sha;

      const res = await fetch(`${API}/repos/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(`${path}: ${res.status} — ${err.message}`);
      }
      return await res.json();
    }

    async function deploy() {
      const token = document.getElementById('token').value.trim();
      const repo = document.getElementById('repo').value.trim();
      if (!token) return log('❌ Enter a token', 'err');
      if (!dirHandle) return log('❌ Select a folder first', 'err');

      const btn = document.getElementById('deploy-btn');
      const progress = document.getElementById('progress');
      const progressBar = document.getElementById('progress-bar');
      btn.disabled = true;
      btn.textContent = '⏳ Pushing...';
      progress.style.display = 'block';

      log('═══════════════════════════════════', 'info');
      log('🚀 Deploy: Visual Upgrades Batch', 'info');
      log(`📦 ${repo}`, 'info');
      log('═══════════════════════════════════', 'info');

      let ok = 0, fail = 0;
      const total = Object.keys(fileContents).length;

      for (const [path, content] of Object.entries(fileContents)) {
        try {
          const sha = await getFileSHA(repo, path, token);
          await pushFile(repo, path, content, token, sha);
          log(`✅ ${path}`, 'ok');
          ok++;
        } catch (e) {
          log(`❌ ${path} — ${e.message}`, 'err');
          fail++;
        }
        progressBar.style.width = `${((ok + fail) / total) * 100}%`;
        await new Promise(r => setTimeout(r, 350));
      }

      log('', '');
      log('═══════════════════════════════════', 'info');
      log(`🏁 Done: ✅ ${ok} pushed, ❌ ${fail} failed`, ok > 0 ? 'ok' : 'err');
      if (ok > 0) {
        log(`🌐 https://jtjustinktaylor-lgtm.github.io/flowjob-app/`, 'ok');
      }
      log('═══════════════════════════════════', 'info');

      btn.disabled = false;
      btn.textContent = '🚀 Push Visual Upgrades';
      setTimeout(() => progress.style.display = 'none', 2000);
    }

    window.addEventListener('DOMContentLoaded', loadToken);
  </script>
</body>
</html>
